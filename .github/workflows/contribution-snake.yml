name: Gerar animação de contribuições

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar animação da cobra
        uses: Platane/snk@v3
        with:
          github_user_name: Mikezinx3
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-dark.gif?color_snake=%2300D9FF&color_dots=%230D1117,%23161B22,%23212830,%2330363D,%2339D353&background=%230D1117

      - name: Publicar arquivos na branch output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
