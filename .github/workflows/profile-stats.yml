name: Atualizar cartões do perfil

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Criar estatísticas no tema escuro
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Mikezinx3&show_icons=true&hide_rank=true&hide_border=true&bg_color=0D1117&title_color=22D3EE&icon_color=A78BFA&text_color=94A3B8
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar estatísticas no tema claro
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Mikezinx3&show_icons=true&hide_rank=true&hide_border=true&bg_color=FFFFFF&title_color=0891B2&icon_color=7C3AED&text_color=334155
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar linguagens no tema escuro
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Mikezinx3&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=22D3EE&text_color=94A3B8
          path: profile/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar linguagens no tema claro
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Mikezinx3&layout=compact&langs_count=8&hide_border=true&bg_color=FFFFFF&title_color=0891B2&text_color=334155
          path: profile/languages-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar sequência no tema escuro
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Mikezinx3&background=0D1117&hide_border=true&stroke=22D3EE&ring=A78BFA&fire=10B981&currStreakLabel=22D3EE&sideLabels=94A3B8&currStreakNum=F8FAFC&sideNums=F8FAFC&dates=64748B
          path: profile/streak-dark.svg

      - name: Criar sequência no tema claro
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Mikezinx3&background=FFFFFF&hide_border=true&stroke=0891B2&ring=7C3AED&fire=059669&currStreakLabel=0891B2&sideLabels=475569&currStreakNum=0F172A&sideNums=0F172A&dates=64748B
          path: profile/streak-light.svg

      - name: Converter cartões SVG para PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

          rsvg-convert -w 1000 -o profile/streak-dark.png profile/streak-dark.svg
          rsvg-convert -w 600 -o profile/stats-dark.png profile/stats-dark.svg
          rsvg-convert -w 600 -o profile/languages-dark.png profile/languages-dark.svg

      - name: Salvar cartões no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "Os cartões já estão atualizados."
          else
            git commit -m "Atualiza cartões de estatísticas"
            git push
          fi
